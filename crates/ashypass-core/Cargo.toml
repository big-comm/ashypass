[package]
name = "ashypass-core"
description = "Ashy Pass — encryption, storage, generator, TOTP, importers, backup (no UI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
fido2 = []

[dependencies]
argon2.workspace = true
aes-gcm.workspace = true
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
rand.workspace = true
base32.workspace = true
base64.workspace = true
zeroize.workspace = true
subtle.workspace = true
rusqlite.workspace = true
tokio.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log.workspace = true
chrono.workspace = true
csv.workspace = true
dirs.workspace = true
bip39.workspace = true
image.workspace = true
zxcvbn.workspace = true
psl = "2"
zip.workspace = true
keepass.workspace = true

# The system keyring (Secret Service over D-Bus) only exists on the Linux
# desktop; elsewhere `keyring` is a stub and the app keeps its own secrets.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

# Android has no system OpenSSL or SQLite for apps: use rustls and the
# bundled SQLite there.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { workspace = true, features = ["rustls-tls"] }
rusqlite = { workspace = true, features = ["bundled"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
hex = "0.4"
