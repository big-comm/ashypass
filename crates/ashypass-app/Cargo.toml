[package]
name = "ashypass-app"
description = "Ashy Pass — GTK4/libadwaita password manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ashypass"
path = "src/main.rs"

[features]
default = []
fido2 = ["ashypass-core/fido2"]

[dependencies]
ashypass-core.workspace = true
ashypass-drives.workspace = true
# The GTK 4.22 and libadwaita 1.9 BigLinux ships (big-gtk-kit needs them).
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
glib = "0.22"
gio = "0.22"
gdk = { package = "gdk4", version = "0.11" }
# BigLinux's GTK building blocks: stand-ins for GTK/libadwaita calls that
# leak (measured), and the tooltip card.
big-gtk-kit = { git = "https://github.com/biglinux/big-gtk-kit", rev = "f77d48052bc445a36050c9f9624d879b04d39076" }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["native-tls"] }
image.workspace = true
url.workspace = true
dirs.workspace = true
zeroize.workspace = true
rqrr = { version = "0.11", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["image"] }

[dev-dependencies]
