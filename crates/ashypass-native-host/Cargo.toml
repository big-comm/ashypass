[package]
name = "ashypass-native-host"
description = "Ashy Pass — native messaging host for browser extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ashypass-native-host"
path = "src/main.rs"

[dependencies]
ashypass-core.workspace = true
anyhow.workspace = true
base64.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
# Public Suffix List (ICANN and private sections), compiled in: no network.
psl = "2"
# Already in the tree through secret-service; used to read logind's LockedHint.
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[dev-dependencies]
tempfile = "3"
